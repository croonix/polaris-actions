name: 'Polaris login'
description: 'Authenticate to a Polaris instance using GitHub Actions OIDC (no static token).'
author: 'croonix'
branding:
  icon: 'lock'
  color: 'blue'

inputs:
  polaris-url:
    description: 'Base URL of the Polaris instance (e.g. https://polaris.example.com).'
    required: true
  audience:
    description: >
      OIDC audience to request. Must match the Polaris instance expectation.
      Defaults to the host of polaris-url (per-instance audience).
      Set explicitly to "polaris" only for instances using the documented
      global fallback audience.
    required: false
                                # No static default here: the audience is computed
                                # from polaris-url's host at runtime, since each
                                # Polaris instance expects its own hostname as the
                                # audience by default.
  account:
    description: 'Polaris account slug. Required only if the repo is trusted in more than one account.'
    required: false
  export-tf-token:
    description: 'Export TF_TOKEN_<host> to $GITHUB_ENV for subsequent tofu/terraform steps.'
    required: false
    default: 'true'
  mask-token:
    description: 'Register the minted token as a secret so it is masked in logs. Keep true.'
    required: false
    default: 'true'

outputs:
  access-token:
    description: 'The minted Polaris access token. Masked. Prefer export-tf-token over consuming this.'
  expires-in:
    description: 'Token lifetime in seconds.'
  account:
    description: 'The Polaris account slug the token is scoped to.'

runs:
  using: 'node24'
  main: 'dist/index.js'
  # No `post:` step: this action only authenticates and mints a token — it
  # doesn't create any files, processes, or state on the runner that would
  # need to be torn down afterwards. There's nothing to clean up.
